[package]
name = "jip"
version = "1.0.0"
edition = "2024"
description = "A pip-like dependency manager and runner for Java — clone it. Run it. Done."
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/autumoswitzerland/jip"
homepage = "https://github.com/autumoswitzerland/jip"
authors = ["autumo GmbH"]
keywords = ["java", "dependency-manager", "maven", "gradle", "build-tool"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "5"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
