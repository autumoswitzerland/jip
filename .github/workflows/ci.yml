# =============================================================================
#  jip — Continuous Integration
#  ---------------------------------------------------------------------------
#  Every push and pull request is built and tested on the three major
#  operating systems, so jip keeps working on every OS.  The release
#  pipeline lives in `release.yml` and only runs on version tags.
#
#  Project:   jip
#  Author:    autumo GmbH
#  Date:      2026-08-16
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Build and test natively on macOS, Linux, and Windows.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
